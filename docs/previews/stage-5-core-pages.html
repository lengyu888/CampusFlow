<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusFlow · 第五阶段界面对照</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8edf4;color:#1c1c1e;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid #0066db;outline-offset:3px}
button{border:0}
header{max-width:1000px;margin:auto;padding:32px 24px 20px}
.eyebrow{color:#526176;font-size:12px;letter-spacing:1px}
h1{font-size:28px;margin:8px 0;font-weight:650;letter-spacing:-.8px}
header p{color:#526176;margin:8px 0 20px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.switch{padding:4px;background:#dce3ed;border-radius:14px;display:flex;gap:4px}
.switch button{border-radius:10px;min-height:44px;padding:8px 20px;background:transparent;color:#526176}
.switch button[aria-pressed=true]{background:#fff;color:#0066db;box-shadow:0 2px 6px #15294b09}
.toolbar label{font-size:13px;color:#526176}
.toolbar select{font:inherit;padding:9px;border:1px solid #c9d2e0;border-radius:10px;background:white}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:32px;justify-content:center;padding:0 24px 32px}
.caption{display:flex;justify-content:space-between;gap:8px;margin:0 4px 10px;font-size:13px;color:#526176}
.caption b{color:#1c1c1e}
.device{width:100%;height:812px;display:flex;flex-direction:column;border:1px solid #cbd4e2;border-radius:30px;overflow:hidden;box-shadow:0 16px 40px #182d4d0c;background:var(--bg)}
.before{--bg:#f2f2f7;--blue:#007aff;--quiet:#63636e;--line:#e5e5ea;--r:22px}
.after{--bg:#f4f6fa;--blue:#0066db;--quiet:#526176;--line:#dfe5ef;--r:20px}
.statusbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:30px;padding:0 24px;font-size:12px;font-weight:600;background:#fff}
.statusbar .sig{font-size:10px;letter-spacing:1px}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.before .scroll{padding-top:16px}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--quiet)}
.meta{font-size:12px;color:var(--quiet)}
.tiny{font-size:11px;color:#8e8e93}
.title{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.before .title{font-size:34px}
.subtitle{font-size:13px;color:var(--quiet);margin-top:6px}
.card{background:white;border-radius:var(--r);padding:16px}
.before .card{padding:20px}
.section-label{font-size:19px;font-weight:650;line-height:1.4}
.before .section-label{font-size:21px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.avatar{flex-shrink:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#eaf3ff;color:var(--blue);font-size:20px;font-weight:600}
.primary,.secondary,.plain{min-height:48px;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:500}
.primary{background:var(--blue);color:white}
.secondary{background:#eaf3ff;color:var(--blue)}
.plain{background:transparent;color:var(--blue);padding:10px 0}
.wide{width:100%}
.icon{width:24px;height:24px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;color:var(--blue)}
.icon.small{width:18px;height:18px}
.hero h2{font-size:21px;line-height:1.4;margin:0}
.hero p{font-size:14px;color:var(--quiet);margin:16px 0}
.services{display:flex;background:white;border-radius:18px;overflow:hidden}
.services>div{flex:1;min-width:0;padding:18px 12px;display:flex;align-items:center;gap:10px}
.services>div+div{border-left:1px solid var(--line)}
.services b{font-size:14px;font-weight:500}
.course{display:flex;gap:14px;align-items:flex-start}
.course+.course{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.course-time{width:52px;flex-shrink:0;color:var(--blue);font-size:16px;font-weight:600}
.course-time small{display:block;color:var(--quiet);font-size:12px;font-weight:400;margin-top:4px}
.course b{font-size:16px;font-weight:600}
.course .meta{margin-top:5px}
.task{display:flex;align-items:center;gap:12px;min-height:64px}
.task+.task{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.check{width:48px;height:48px;flex-shrink:0;background:transparent;display:grid;place-items:center}
.check:before{content:'';width:23px;height:23px;border:1.5px solid #8993a2;border-radius:50%}
.check.done:before{content:'✓';background:#248a3d;color:white;border:0}
.badge{font-size:12px;padding:4px 8px;color:var(--blue);border-radius:8px;background:#eaf3ff;flex-shrink:0}
.task b{font-size:15px;font-weight:500}
.agent-entry{background:#eaf3ff}
.agent-entry b{font-size:15px}
.agent-entry .meta{margin-top:4px}
.progress{height:5px;background:#f2f2f7;border-radius:5px;margin:14px 0}
.progress span{display:block;height:100%;background:var(--blue);border-radius:5px}
.tabs{display:flex;flex-shrink:0;background:#fff;border-top:1px solid #e9edf2;padding:10px 10px 18px;gap:4px}
.tabs button{display:flex;flex:1;min-width:0;gap:3px;flex-direction:column;align-items:center;justify-content:center;padding:0;background:transparent;color:#63636e;font-size:11px;min-height:44px}
.tabs .icon{color:inherit;width:23px;height:23px}
.tabs button.active{color:#007aff}
.agent-top{min-height:56px;padding:0 10px 0 16px;display:flex;align-items:center;gap:2px;flex-shrink:0}
.after .agent-top{background:white;border-bottom:1px solid var(--line)}
.agent-top b{font-size:17px;flex:1;min-width:0}
.agent-top button{height:48px;min-width:48px;background:transparent;color:var(--blue);font-size:13px;padding:8px;display:grid;place-items:center}
.agent-scroll{padding:8px 20px 24px}
.welcome{padding:16px 0 8px}
.welcome h2{font-size:30px;margin:12px 0;line-height:1.3}
.welcome p{font-size:15px;color:var(--quiet);line-height:23px;margin:0 0 12px}
.before .welcome{padding:22px 4px 18px}
.before .welcome>.icon{width:38px;height:38px}
.before .welcome h2{font-size:31px;margin:12px 0}
.before .welcome p{line-height:24px}
.suggestions{display:flex;flex-direction:column;gap:12px}
.suggestion{text-align:left;display:flex;align-items:center;gap:12px;border-radius:20px;padding:16px;background:white;width:100%;min-height:76px}
.suggestion b{font-size:15px;font-weight:600;display:block}
.suggestion .meta{display:block;margin-top:4px}
.iconbox{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#eaf3ff;flex-shrink:0}
.before .suggestions{background:white;border-radius:20px;gap:0;overflow:hidden}
.before .suggestion{padding:17px;min-height:80px;border-radius:0}
.before .suggestion+.suggestion{border-top:1px solid var(--line)}
.before .iconbox{background:none;width:22px}
.before .suggestion b{font-size:16px}
.hint{font-size:12px;color:var(--quiet);margin-top:16px}
.before .hint{font-size:11px;color:#8e8e93}
.composer{padding:12px 20px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.composer .row{gap:8px;align-items:flex-end}
.composer-label{font-size:12px;display:flex;justify-content:space-between;color:var(--quiet);margin-bottom:8px}
.composer textarea{resize:none;width:100%;min-height:48px;height:48px;max-height:160px;padding:13px 12px 10px 15px;border:0;border-radius:14px;background:var(--bg);font-size:16px;line-height:23px;color:#1c1c1e;display:block}
.composer .input{flex:1;min-width:0}
.composer button{min-width:64px}
.composer button:disabled{background:#f2f2f7;color:#8e8e93}
.before .composer{padding:10px 16px}
.before .composer textarea,.before .composer button{border-radius:22px}
.chat{display:flex;flex-direction:column;gap:16px}
.bubble{padding:13px 16px;background:white;border-radius:20px 20px 20px 6px;font-size:15px;line-height:24px}
.bubble.user{background:var(--blue);color:white;align-self:flex-end;width:90%;border-radius:20px 20px 6px 20px}
.bubble p{margin:8px 0}
.tool{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.tool-box{font-size:12px;padding:10px;background:#f2f2f7;border-radius:10px;margin-top:8px;line-height:20px}
.proposal{background:#eaf3ff;padding:16px;border-radius:20px;border:1px solid var(--line)}
.proposal h3{font-size:18px;line-height:1.5;margin:10px 0}
.proposal p{font-size:14px;color:var(--quiet);margin:10px 0}
.proposal details{font-size:13px;background:white;border-radius:12px;padding:12px;margin:12px 0}
.proposal summary{cursor:pointer;color:var(--blue);min-height:24px}
.proposal .row{gap:8px}
.proposal .row button{flex:1}
.calendar{margin-top:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 1px;margin-top:12px}
.cal-grid button,.cal-grid span{height:44px;padding:0;border-radius:24px;background:none;display:grid;place-items:center;font-size:15px}
.cal-grid button.selected{background:var(--blue);color:white}
.cal-grid .week{font-size:12px;color:#8e8e93;height:28px}
.cal-grid button.dot:after{content:'';width:4px;height:4px;border-radius:50%;background:currentColor;margin-top:-10px;color:var(--blue)}
.cal-grid button.selected:after{color:white}
.day-meta{font-size:12px;color:var(--quiet);margin-top:4px}
.timeline{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.timeline-item{padding:14px;background:#f2f2f7;border-radius:14px;display:flex;align-items:center;gap:12px}
.timeline-item b{font-size:15px;display:block;margin:4px 0}
.timeline-item .time{font-size:14px;color:var(--blue);font-weight:500}
.after .timeline-item{background:#f4f6fa}
.disclosure{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;padding:0;background:transparent;color:var(--blue);text-align:left}
.disclosure span{font-size:14px}
.stats{display:flex;gap:16px;align-items:center}
.stats>div{flex:1}
.stats>div+div{border-left:1px solid var(--line);padding-left:16px}
.stats b{font-size:24px;display:block;margin-bottom:4px}
.task-form{margin-top:16px}
.task-form input{width:100%;border:0;background:#f2f2f7;border-radius:14px;padding:13px 14px;min-height:48px;font-size:15px}
.field-row{display:flex;justify-content:space-between;font-size:14px;margin:16px 0 10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choices button{min-height:48px;border-radius:12px;background:#f2f2f7;color:var(--quiet);font-size:13px;padding:10px}
.choices button.selected{background:var(--blue);color:white}
.footnote{max-width:820px;margin:0 auto;padding:0 24px 32px;font-size:12px;color:#526176}
.empty{font-size:14px;color:var(--quiet);padding:12px 0}
.demo-notice{color:#526176;background:#eef2f7;padding:12px 16px;border-radius:12px;font-size:12px;margin-top:16px}
.highlight{color:var(--blue)}
[hidden]{display:none!important}
@media(max-width:750px){header{padding:20px 16px 16px}
h1{font-size:23px}
.comparison{grid-template-columns:minmax(0,390px);gap:24px;padding:0 12px 24px}
.switch button{padding:8px 16px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}
}

.after .home-after{padding:16px 20px 32px}
.after .home-after .home-header .subtitle{font-size:12px;margin-top:4px}
.after .home-after .home-header .avatar{font-size:18px;font-weight:500}
.after .home-after .section-label{font-weight:700}
.after .home-after .home-course{display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.after .home-after .home-course-time{font-size:12px;font-weight:500;color:var(--blue)}
.after .home-after .home-course b{font-size:15px;font-weight:500}
.after .home-after .home-section-subtitle{margin-top:4px}
.after .home-after .home-add{min-width:64px;padding:8px}
.after .home-after .home-tasks{padding:0;overflow:hidden}
.after .home-after .home-task{position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px}
.after .home-after .home-task+.home-task:before{content:'';position:absolute;left:64px;right:16px;top:0;border-top:1px solid var(--line)}
.after .home-after .home-task b{display:block;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.after .home-after .home-task .meta{margin-top:4px;overflow-wrap:anywhere}
.after .home-after .home-task .check:before{width:24px;height:24px;border-color:var(--quiet)}
.after .home-after .home-shortcuts{display:flex;flex-direction:column;gap:12px}
.after .home-after .agent-entry{min-height:64px;text-align:left}
.after .home-after .agent-entry b{font-weight:500;color:var(--blue);overflow-wrap:anywhere}
.after .home-after .agent-entry .meta{overflow-wrap:anywhere}
.after .home-after .agent-entry .icon.small{width:16px;height:16px}
.after .home-after .home-tools{display:flex;gap:12px}
.after .home-after .home-tools button{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:white;text-align:left}
.after .home-after .home-tools span{flex:1;min-width:0;font-size:14px;font-weight:500;color:#1c1c1e;overflow-wrap:anywhere}
.after .home-after .home-tools .icon{width:20px;height:20px}
.after .home-after .home-tools button:last-child .icon{color:var(--quiet)}
.after .home-after .home-empty-plan{min-height:64px;text-align:left}
.after .home-after .home-empty-plan b{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.after .home-after .home-empty-plan .meta{margin-top:4px;overflow-wrap:anywhere}
.after .home-after .home-empty-plan .icon{width:22px;height:22px}
.after .home-after .home-empty-plan .icon.small{width:16px;height:16px;color:var(--quiet)}

/* Planning-only dimensions follow the two ArkUI page versions, including their different order. */
.plan-preview{padding:20px 20px 32px!important}
.plan-preview .plan-header{gap:8px}
.plan-preview .plan-header>.grow{min-width:0}
.plan-preview .subtitle{font-size:15px;margin-top:8px}
.before .plan-preview .title{font-size:32px}
.before .plan-preview .subtitle{font-size:14px;margin-top:7px}
.plan-preview .card{padding:16px;border-radius:20px}
.before .plan-preview .card{padding:18px;border-radius:22px}
.plan-preview .section-label{font-size:19px;font-weight:700}
.before .plan-preview .section-label{font-size:20px}
.plan-preview .plan-header .avatar{width:48px;height:48px;background:white}
.before .plan-preview .plan-header .avatar{width:46px;height:46px}
.before .plan-preview .plan-header .icon{width:22px;height:22px}
.plan-preview .primary,.plan-preview .secondary{font-size:15px;padding:12px;border-radius:14px;line-height:1.5}
.before .plan-preview .primary,.before .plan-preview .secondary{font-size:14px;border-radius:12px}
.plan-preview .plan-assistant{display:flex;flex-direction:column;gap:12px}
.plan-preview .plan-assistant h2{font-size:19px;line-height:1.4;margin:0}
.plan-preview .plan-assistant p{font-size:14px;margin:0;color:var(--quiet)}
.plan-preview .plan-assistant .row{gap:8px}
.before .plan-preview .plan-assistant{gap:15px;padding:20px}
.before .plan-preview .plan-assistant .row{gap:10px}
.before .plan-preview .plan-assistant .meta{color:#8e8e93}
.plan-preview .plan-assistant-copy{display:flex;flex-direction:column;gap:6px}
.plan-preview .plan-confirmed>.section-label{margin-bottom:12px}
.plan-preview .plan-confirmed>.card{font-size:15px;line-height:22px;color:var(--quiet);border-radius:20px}
.before .plan-preview .plan-confirmed>.card{font-size:14px}
.plan-preview .plan-agenda,.plan-preview .plan-add{display:flex;flex-direction:column;gap:16px}
.plan-preview .plan-agenda .day-date{font-size:19px;font-weight:500;line-height:1.5}
.before .plan-preview .plan-agenda .day-date{font-size:16px}
.plan-preview .timeline{margin:0;gap:12px}
.plan-preview .timeline-item{padding:12px;border-radius:14px;gap:8px;background:var(--bg)}
.plan-preview .timeline-item.course-entry{padding:16px;gap:12px}
.before .plan-preview .timeline-item.course-entry{padding:14px}
.plan-preview .timeline-item .grow{display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.before .plan-preview .timeline-item .grow{gap:5px}
.plan-preview .timeline-item b{font-size:15px;font-weight:500;margin:0}
.plan-preview .timeline-item .time{font-size:15px}
.before .plan-preview .timeline-item .time{font-size:14px}
.plan-preview .timeline-item .task-time{font-size:12px;font-weight:500;color:#c05600}
.plan-preview .timeline-item .badge{padding:5px 8px;border-radius:7px}
.before .plan-preview .timeline-item .badge{font-size:11px}
.plan-preview .check{width:48px;height:48px;padding:0}
.before .plan-preview .check{width:44px;height:44px}
.plan-preview .check:before{width:25px;height:25px;border-color:var(--quiet)}
.before .plan-preview .check:before{border-color:#c7c7cc}
.plan-preview .check.done:before{background:var(--blue)}
.plan-preview .plan-empty{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:20px 0;color:var(--quiet);font-size:15px}
.before .plan-preview .plan-empty{gap:7px;font-size:14px}
.plan-preview .plan-empty>.icon{width:28px;height:28px;color:#8e8e93}
.plan-preview .plan-empty .meta{color:#8e8e93}
.plan-preview .plan-calendar-toggle{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-height:48px;padding:12px;color:var(--blue);background:#eaf3ff;border-radius:14px;font-size:15px}
.plan-preview .plan-calendar-toggle>.icon{width:20px;height:20px}
.plan-preview .calendar{margin:0;display:flex;flex-direction:column;gap:16px}
.plan-preview .calendar>.row{gap:0}
.plan-preview .calendar .month-label{font-size:19px;font-weight:700;flex:1;min-width:0}
.before .plan-preview .calendar .month-label{font-size:20px}
.plan-preview .month-controls{display:flex;gap:0}
.plan-preview .month-controls button{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:transparent}
.before .plan-preview .month-controls button{width:44px;height:44px}
.plan-preview .month-controls .icon{width:17px;height:17px}
.plan-preview .calendar-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:#8e8e93;text-align:center}
.plan-preview .cal-grid{margin:0;gap:2px 1px;grid-auto-rows:44px;align-content:start}
.plan-preview .cal-grid button{display:flex;flex-direction:column;justify-content:center;gap:3px;font-weight:400;line-height:20px}
.plan-preview .cal-grid button.selected{font-weight:700}
.plan-preview .cal-markers{display:flex;gap:3px;height:5px}
.plan-preview .cal-markers i{display:block;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.plan-preview .cal-markers i.task-marker{background:#c05600}
.plan-preview .selected .cal-markers i{background:white}
.plan-preview .disclosure{gap:8px;border-radius:14px}
.plan-preview .disclosure span{font-size:15px}
.plan-preview .disclosure b{font-size:19px;color:#1c1c1e;flex:1;min-width:0}
.plan-preview .draft-summary{font-size:15px;color:var(--quiet);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.plan-preview .task-form{display:flex;flex-direction:column;gap:16px;margin:0}
.plan-preview .task-form label{font-size:15px;color:var(--quiet)}
.plan-preview .task-form .row{gap:8px}
.before .plan-preview .task-form .row{gap:10px}
.plan-preview .task-form input{height:48px;min-width:0;padding:12px 14px;border-radius:14px;background:var(--bg);color:#1c1c1e;flex:1}
.before .plan-preview .task-form input{border-radius:13px}
.plan-preview .task-form [data-add]{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:50%;padding:0;display:grid;place-items:center;flex-shrink:0}
.plan-preview .task-form [data-add]>.icon{width:22px;height:22px;color:white}
.plan-preview .task-form [data-add]:disabled{opacity:.4}
.before .plan-preview .task-form [data-add]{width:46px;height:46px;min-width:46px;min-height:46px}
.plan-preview .field-row{font-size:15px;margin:0;gap:8px}
.before .plan-preview .field-row{font-size:14px}
.plan-preview .field-row .highlight{font-weight:500;text-align:right}
.plan-preview .choices{gap:16px 8px}
.before .plan-preview .choices{gap:16px 6px}

function stats(before=false){return `<div class="card plan-stats"><div class="stats"><div><b class="highlight">0%</b><span class="meta" ${before?'style="font-size:13px"':''}>总体完成进度</span></div><div class="stat-line"></div><div><b>2</b><span class="meta">今日待执行</span></div></div>${before?'':'<div class="meta">0/2 项已完成 · 0 项尚未安排时间</div>'}</div>`}
let renderSide='before';
function render(){if(!['home','agent','plan'].includes(state.page))state.page='home';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));document.getElementById('agent-mode-label').hidden=state.page!=='agent';document.getElementById('agent-mode').value=state.mode;for(const id of ['before','after']){renderSide=id;document.getElementById(id).innerHTML=`<div class="statusbar"><span>11:41</span><span class="sig">▮▮▮　100%</span></div><div class="app">${state.page==='home'?home(id==='before'):state.page==='agent'?agent(id==='before'):plan(id==='before')}</div>${nav()}`}document.getElementById('changes').textContent=({home:'首页：课程和待办前置；大幅收起宣传区，Agent 与校园工具保留为清晰入口。',agent:'Agent：欢迎页更紧凑；建议可点击填入；回答、工具记录和提案分层。切换场景可查看计划预览。',plan:'规划：选中日期的安排优先显示；月历和新增待办按需展开，收起后保留草稿。'})[state.page]+' 预览可切换页面、填入建议、展开月历/表单；课程和对话均为示例。所有数据只存在当前浏览器内，不调用模型或后端。';}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render()}else if(b.dataset.planPrompt){state.page='agent';state.mode='welcome';state.input=b.dataset.planPrompt==='week'?'请读取我的课表和未完成待办，为未来 7 天制定一份可执行的学习计划。要求避开课程冲突，拆分里程碑和具体任务，为每项任务设置明确时间、地点与提醒；先展示提案，等我确认后再写入规划。':'请结合我的近期课程和未完成任务，安排今天晚上的复习计划。先检查时间冲突，给出具体时间段和提醒，等待我确认后再写入。';render()}else if(b.dataset.prompt){state.page='agent';state.mode='welcome';state.input=prompts[Number(b.dataset.prompt)];render()}else if(b.hasAttribute('data-send')){state.mode='chat';state.input='';render()}else if(b.hasAttribute('data-calendar')){state.calendar=!state.calendar;render()}else if(b.hasAttribute('data-form')){state.form=!state.form;render()}else if(b.dataset.date){state.date=Number(b.dataset.date);render()}else if(b.dataset.month){let d=new Date(state.year,state.month+Number(b.dataset.month),1);state.year=d.getFullYear();state.month=d.getMonth();state.date=1;render()}else if(b.dataset.dateChoice){state.dateChoice=b.dataset.dateChoice;state.draftDate=b.dataset.dateValue;if(state.draftDate==='')state.time='全天';render()}else if(b.dataset.time){state.time=b.dataset.time==='自定义'?'18:30':b.dataset.time;if(state.time!=='全天'&&state.draftDate===''){state.dateChoice='今天';state.draftDate='2026-10-16'}render()}else if(b.hasAttribute('data-check')){b.classList.toggle('done')}else if(b.dataset.proposal){let s=b.closest('.proposal').querySelector('[data-proposal-status]');s.hidden=false;s.textContent='仅展示反馈，不会写入真实规划。'}else if(b.hasAttribute('data-add')){let s=b.closest('.task-form').querySelector('[data-form-result]');s.hidden=false;s.textContent=state.draft.trim()?'预览已记录此草稿，不会写入真实待办。':'请先填写待办内容。'}});
document.addEventListener('input',e=>{if(e.target.matches('textarea')){state.input=e.target.value;document.querySelectorAll('textarea').forEach(t=>{if(t!==e.target)t.value=state.input});document.querySelectorAll('[data-send]').forEach(b=>b.disabled=!state.input.trim());e.target.style.height='48px';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'}else if(e.target.matches('.task-form input')){state.draft=e.target.value;document.querySelectorAll('.task-form input').forEach(t=>{if(t!==e.target)t.value=state.draft});document.querySelectorAll('.after .plan-preview [data-add]').forEach(b=>b.disabled=!state.draft.trim());document.querySelectorAll('[data-draft-summary]').forEach(t=>t.textContent=state.draft.trim()?`草稿：${state.draft}`:'先记下来，再安排时间。')}});
document.getElementById('agent-mode').addEventListener('change',e=>{state.mode=e.target.value;render()});render();
</script>
</html>
